name: Validate skills
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install python-pptx pyyaml
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s skills/sermon-deck/tests -v
      - run: python -m unittest discover -s skills/mcy-music-find-new-songs/tests -v
      - run: python -m unittest discover -s skills/mcy-music-team-announce/tests -v
